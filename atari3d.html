<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーツ立体アタリ</title>
<link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
<style>
:root{--bg:#f4f2ee;--panel:#fff;--ink:#222;--sub:#6b6b6b;--line:#dedad3;--acc:#d2553a;--acc-ink:#fff;--stage:#e6e2db;--soft:#f0ede8;--float:rgba(255,255,255,.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--panel:#232326;--ink:#ececec;--sub:#a5a5a5;--line:#3a3a3f;--acc:#e8714f;--stage:#121214;--soft:#2c2c30;--float:rgba(35,35,38,.95)}}
:root[data-theme="dark"]{--bg:#1b1b1d;--panel:#232326;--ink:#ececec;--sub:#a5a5a5;--line:#3a3a3f;--acc:#e8714f;--stage:#121214;--soft:#2c2c30;--float:rgba(35,35,38,.95)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
button{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--sub)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px}
#app{display:flex;flex-direction:column;height:100dvh}

/* 上：タブ */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:46px}
.logo{font-weight:700;white-space:nowrap}
#tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:thin;padding-bottom:1px}
.tab{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:7px;background:var(--soft);cursor:pointer;white-space:nowrap;flex:none;height:34px}
.tab.on{border-color:var(--acc);background:var(--panel);box-shadow:inset 0 -2px 0 var(--acc)}
.tab canvas{width:26px;height:26px;border-radius:4px;background:#fff}
.tab .x{border:0;background:none;padding:0 2px;color:var(--sub);font-size:14px;line-height:1}
.tab.add{color:var(--acc);font-weight:600;padding:3px 10px}
#hint{flex:1;min-width:0;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint b{color:var(--acc)}

/* まん中：キャンバス */
#wrap{flex:1;position:relative;overflow:hidden;background:var(--stage);touch-action:none;min-height:0}
#wrap>canvas,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#wrap.pen canvas{cursor:crosshair}
#wrap.hand canvas{cursor:grab}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);padding:20px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:10px}
.empty button.big{font-size:15px;padding:10px 22px;margin-bottom:10px}
.float{position:absolute;background:var(--float);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 12px #0002;z-index:3}
#tbar{top:10px;right:10px;display:flex;gap:3px;padding:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
.ib{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:7px;background:transparent;border:1px solid transparent;position:relative}
.ib:hover{border-color:var(--line)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--acc);color:var(--acc-ink)}
.ib.tog.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}
.ib kbd{position:absolute;right:2px;bottom:0;font-size:8px;opacity:.6;font-family:inherit}
.sep{width:1px;height:24px;background:var(--line);margin:0 3px}
#selMode{height:34px}
#props{top:60px;right:10px;width:272px;max-height:calc(100% - 120px);overflow:auto;padding:10px 12px}
#props .ph{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#props .ph b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#props select{width:100%}
.lbl{font-size:11px;color:var(--sub);font-weight:600;margin:8px 0 3px}
details summary{cursor:pointer;font-size:11px;color:var(--sub);font-weight:600;margin:8px 0 3px}
.pop{top:60px;right:10px;width:270px;padding:10px 12px;z-index:4}
#zoomBox{left:10px;bottom:10px;display:flex;gap:2px;align-items:center;padding:3px}
#zoomBox button{padding:3px 8px}
#zoomBox span{min-width:48px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0}
label.sl{display:grid;grid-template-columns:66px 1fr 42px;gap:6px;align-items:center;margin:2px 0}
label.sl span{color:var(--sub);font-size:11px}
label.sl output{font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
label.sl.dis{opacity:.4;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--acc)}
label.ck{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:12px}
.st{color:var(--sub);font-size:11px}

/* 下：パーツのトレイ */
#tray{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;min-height:78px;flex:none}
#tray .none{color:var(--sub);font-size:12px}
.chip{position:relative;flex:none;width:64px;height:64px;border:2px solid var(--line);border-radius:9px;cursor:pointer;touch-action:pan-x;user-select:none;-webkit-user-select:none;
  background:conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0) 0 0/12px 12px}
.chip.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.chip canvas{width:100%;height:100%;display:block;border-radius:7px}
.chip .nm{position:absolute;left:0;right:0;bottom:0;font-size:9px;background:#000a;color:#fff;text-align:center;border-radius:0 0 7px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.chip .badge{position:absolute;left:3px;top:3px;font-size:9px;background:var(--acc);color:#fff;border-radius:4px;padding:0 3px}
.chip .eye{position:absolute;right:2px;top:2px;width:18px;height:18px;padding:0;border-radius:50%;font-size:10px;line-height:1;background:var(--float)}
.chip.off canvas{opacity:.3}
.ghost{position:fixed;width:56px;height:56px;pointer-events:none;z-index:20;opacity:.85;transform:translate(-50%,-50%);border-radius:8px;box-shadow:0 4px 14px #0004}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.show{opacity:.92}
.drop #wrap{outline:3px dashed var(--acc);outline-offset:-8px}
@media (max-width:760px){
  .logo{display:none}
  #top{flex-wrap:wrap}
  #hint{order:3;flex-basis:100%;white-space:normal}
  #props{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:46%}
  .pop{left:10px;right:10px;width:auto}
  #zoomBox{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="logo">パーツ立体アタリ</span>
    <nav id="tabs"></nav>
    <div id="hint"></div>
    <button id="bExportMenu" class="pri">書き出し</button>
  </header>

  <main id="wrap">
    <canvas id="cView"></canvas>
    <canvas id="c3d"></canvas>
    <svg id="ov" preserveAspectRatio="none"></svg>
    <div id="empty" class="empty"></div>

    <div id="tbar" class="float" hidden>
      <!-- 資料のとき -->
      <span class="tg-ref" style="display:contents">
        <button class="ib" data-rtool="pen" title="ペン：囲むとパーツになる（クリックで点・ドラッグで線。始点クリック／ダブルクリック／Enter で閉じる）"><svg viewBox="0 0 24 24"><path d="M4 20l3.5-1 11-11-2.5-2.5-11 11z"/><path d="M14.5 6.5l3 3"/></svg><kbd>P</kbd></button>
        <button class="ib" data-rtool="erase" title="投げ縄：囲んだパーツを消す"><svg viewBox="0 0 24 24"><path d="M12 4c5 0 8 2.5 8 5.5S17 15 12 15s-8-2.5-8-5.5S7 4 12 4z" stroke-dasharray="3 2.5"/><path d="M7 14c-1 2 0 4 2 4s2-2 1-3"/><path d="M15 17l4 4M19 17l-4 4"/></svg><kbd>L</kbd></button>
        <button class="ib" data-rtool="hand" title="手：表示を動かす・パーツの囲みをクリックで選ぶ"><svg viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7-2.5 0-4-1.5-5.5-4L4 13a1.5 1.5 0 0 1 2.5-1.5L8 13"/></svg><kbd>H</kbd></button>
      </span>
      <!-- 絵のとき -->
      <span class="tg-art" style="display:contents">
        <button class="ib" data-gmode="translate" title="移動（W）"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><kbd>W</kbd></button>
        <button class="ib" data-gmode="rotate" title="回転（E）"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><kbd>E</kbd></button>
        <button class="ib" data-gmode="scale" title="拡大縮小（R）"><svg viewBox="0 0 24 24"><path d="M4 14v6h6M4 20l7-7M20 10V4h-6M20 4l-7 7"/></svg><kbd>R</kbd></button>
        <button class="ib" data-gmode="pen" title="ペン：選んでいるパーツのアタリを囲む（囲んだ範囲に合わせて置く）"><svg viewBox="0 0 24 24"><path d="M4 20l3.5-1 11-11-2.5-2.5-11 11z"/><path d="M14.5 6.5l3 3"/></svg><kbd>P</kbd></button>
        <span class="sep"></span>
        <button class="ib tog" id="bSpace" title="軸：ローカル（パーツの向き）／ワールド（画面の向き）"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
        <span class="sep"></span>
        <select id="selMode" title="パーツの見え方">
          <option value="tex">資料の色</option>
          <option value="gray">グレー</option>
          <option value="flat">面</option>
          <option value="line">線画</option>
          <option value="wire">ワイヤー</option>
        </select>
        <button class="ib tog" id="bLine" title="線画を重ねる"><svg viewBox="0 0 24 24"><path d="M4 18c3-6 6-9 9-9s3 4 7 1"/><path d="M4 21h16"/></svg></button>
        <button class="ib tog" id="bLow" title="単純化ポリゴン（ローポリ）"><svg viewBox="0 0 24 24"><path d="M12 3l8 6-3 11H7L4 9z M12 3L7 20M12 3l5 17M4 9h16"/></svg></button>
        <span class="sep"></span>
        <button class="ib" id="bViewPop" title="見え方の設定（濃さ・パース・光・線の太さ）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
        <button class="ib tog on" id="bProps" title="パーツの設定パネル"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      </span>
    </div>

    <div id="props" class="float" hidden>
      <div class="ph"><b id="pName"></b><button id="bPropsMin" title="たたむ">－</button></div>
      <div class="lbl">立体にする</div>
      <select id="selMethod"></select>
      <div id="slModel"></div>
      <label class="ck" id="ckInvWrap"><input type="checkbox" id="ckInv">暗いところを高くする</label>
      <div class="row"><button id="bFit">アタリに合わせる</button><button id="bFitStretch">縦横もアタリに</button></div>
      <details><summary>数値で位置を合わせる</summary>
        <div id="slPos"></div>
        <label class="ck"><input type="checkbox" id="ckMirror">左右反転</label>
        <div class="row"><button id="bRotReset">回転をもどす</button></div>
      </details>
      <div class="row" style="margin-top:8px"><button id="bDup">複製</button><button id="bUnplace">絵から外す</button><button id="bDel">消す</button></div>
    </div>

    <div id="popView" class="float pop" hidden>
      <div id="slView"></div>
      <label class="ck"><input type="checkbox" id="ckTargets" checked>アタリの囲みを表示</label>
    </div>

    <div id="popExport" class="float pop" hidden>
      <div class="lbl" style="margin-top:0">透過 PNG で書き出す</div>
      <label class="ck"><input type="radio" name="scope" value="all" checked>絵に置いたパーツをすべて</label>
      <label class="ck"><input type="radio" name="scope" value="cur">選んでいるパーツだけ</label>
      <label class="ck"><input type="checkbox" id="ckClip">アタリの囲みの外を消す</label>
      <label class="ck"><input type="checkbox" id="ckWithArt">絵も重ねる（確認用。透過にならない）</label>
      <div class="row"><button id="bExport" class="pri">書き出す</button></div>
      <p class="st" style="margin:0">絵と同じ大きさです。ペイントソフトで絵の上のレイヤーにそのまま重なります。</p>
    </div>

    <div id="zoomBox" class="float" hidden>
      <button id="bZoomOut" title="縮小">－</button><span id="zoomVal">100%</span><button id="bZoomIn" title="拡大">＋</button><button id="bZoomFit" title="全体を表示">全体</button>
    </div>
  </main>

  <footer id="tray"></footer>
</div>
<input type="file" id="fArt" accept="image/*" hidden>
<input type="file" id="fRef" accept="image/*" multiple hidden>
<div id="toast"></div>

<script type="module">
// ---------- three.js（配布版は同梱バンドル、アーティファクト版は CDN） ----------
let THREE, TransformControls;
try { ({THREE, TransformControls} = await import('./vendor/kouzu3d.js')); if (!TransformControls) throw new Error('old bundle'); }
catch (e) {
  THREE = await import('three');
  ({TransformControls} = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/TransformControls.js'));
}

const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------- state ----------
// 画像はメモリ上だけ。localStorage にも IndexedDB にも残さない。
const st = {
  art: null, refs: [], ref: null, seq: 0, parts: [], cur: null, pid: 0,
  view: 'art', rtool: 'pen', gmode: 'translate', space: 'local',
  mode: 'tex', lineOver: false, lowpoly: false, lowRes: 28, lineW: 3,
  showTargets: true, opacity: 0.92, artFade: 1, fov: 30, lightAz: -35, lightEl: 40,
  scope: 'all', clip: false, withArt: false, propsOpen: true,
};
let passSet = null; // 書き出しでパーツごとに描くとき

const METHODS = {
  mech:    {label: 'メカ・小物（色の区切り・線・丸を読む）', alpha: true, inv: true, prm: {depth: [5, 200, 40, '厚み'], smooth: [0, 8, 2, '面取り'], levels: [2, 8, 4, '色の段数'], step: [0, 150, 50, '段の高さ'], groove: [0, 100, 50, '線の彫り']}},
  inflate: {label: 'ふくらませる（髪・手・布）', alpha: true, prm: {depth: [0, 200, 60, 'ふくらみ'], smooth: [0, 8, 3, 'なめらか']}},
  extrude: {label: '押し出す（板・刃物・アクセサリー）', alpha: false, prm: {depth: [1, 200, 15, '厚み'], smooth: [0, 8, 1, '角の丸み']}},
  lathe:   {label: '回転体（ビン・カップ・柱）', alpha: false, prm: {depth: [10, 200, 100, '奥行き'], smooth: [0, 8, 2, 'なめらか']}},
  relief:  {label: '明暗の凹凸（レリーフ）', alpha: true, inv: true, prm: {depth: [0, 200, 25, '凹凸'], smooth: [0, 8, 2, 'なめらか']}},
  box:     {label: '箱', alpha: false, prm: {depth: [1, 300, 60, '奥行き']}},
  cyl:     {label: '円柱', alpha: false, prm: {depth: [10, 300, 100, '奥行き']}},
  sphere:  {label: '球', alpha: false, prm: {depth: [10, 300, 100, '奥行き']}},
};
const PRM_KEYS = ['depth', 'smooth', 'levels', 'step', 'groove'];
function defaults(m) { const o = {}; for (const [k, v] of Object.entries(METHODS[m].prm)) o[k] = v[2]; return o; }

// ---------- three ----------
const wrap = $('#wrap'), cView = $('#cView'), c3d = $('#c3d');
const renderer = new THREE.WebGLRenderer({canvas: c3d, alpha: true, antialias: true, preserveDrawingBuffer: true});
renderer.autoClear = false; renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 10000);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8580, 1.25);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
scene.add(hemi, sun, sun.target);

// 3D ソフトでおなじみの移動・回転・拡大のハンドル
const tc = new TransformControls(camera, c3d);
tc.setSize(0.9); tc.setSpace('local'); scene.add(tc);
tc.addEventListener('change', () => requestRender());
tc.addEventListener('objectChange', () => { const p = st.cur; if (p && tc.mode === 'scale') normScale(p); syncSoon(); });

// 線画：法線と深度を描いて、そのつなぎ目に線を引く
const rt = new THREE.WebGLRenderTarget(1, 1, {minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter});
rt.depthTexture = new THREE.DepthTexture(1, 1);
const postMat = new THREE.ShaderMaterial({
  uniforms: {tN: {value: rt.texture}, tD: {value: rt.depthTexture}, texel: {value: new THREE.Vector2(1, 1)}, thick: {value: 1},
    cn: {value: 1}, cf: {value: 100}, dthr: {value: 10}, nthr: {value: 0.82}, col: {value: new THREE.Color(0x18181a)}, op: {value: 1}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tN; uniform sampler2D tD; uniform vec2 texel; uniform float thick, cn, cf, dthr, nthr, op; uniform vec3 col;
    varying vec2 vUv;
    float lin(float d){ float z = d * 2.0 - 1.0; return 2.0 * cn * cf / (cf + cn - z * (cf - cn)); }
    void main(){
      vec4 c = texture2D(tN, vUv); float dc = lin(texture2D(tD, vUv).x); float e = 0.0;
      for (int i = 0; i < 8; i++) {
        float a = float(i) * 0.785398;
        vec2 uv = vUv + vec2(cos(a), sin(a)) * texel * thick;
        vec4 o = texture2D(tN, uv);
        if (abs(o.a - c.a) > 0.5) { e = 1.0; break; }
        if (c.a > 0.5) {
          float k = dot(normalize(c.rgb * 2.0 - 1.0), normalize(o.rgb * 2.0 - 1.0));
          e = max(e, smoothstep(nthr + 0.06, nthr - 0.06, k));
          float d = lin(texture2D(tD, uv).x);
          e = max(e, smoothstep(dthr * 0.6, dthr * 1.4, abs(d - dc)));
        }
      }
      gl_FragColor = vec4(col, e * op);
    }`,
  transparent: true, depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
{ const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat); q.frustumCulled = false; postScene.add(q); }
function makeNMat() {
  return new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: {map: {value: null}, useMap: {value: 0}, uFlat: {value: 0}},
    vertexShader: 'varying vec3 vN; varying vec3 vV; varying vec2 vUv; void main(){ vUv = uv; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = mv.xyz; gl_Position = projectionMatrix * mv; }',
    fragmentShader: `uniform sampler2D map; uniform float useMap; uniform float uFlat; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
      void main(){
        if (useMap > 0.5 && texture2D(map, vUv).a < 0.5) discard;
        vec3 n = uFlat > 0.5 ? normalize(cross(dFdx(vV), dFdy(vV))) : normalize(vN) * (gl_FrontFacing ? 1.0 : -1.0);
        gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
      }`,
  });
}

let WW = 1, WH = 1, DPR = 1;
let needRender = false;

// ---------- export ----------
function exportPNG() {
  const A = st.art; if (!A) return;
  const list = (st.scope === 'cur' ? [st.cur] : st.parts).filter(p => p && p.mesh && p.visible && p.placed);
  if (!list.length) { toast('絵に置いたパーツがありません'); return; }
  const gl = renderer.getContext(), vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  const lim = Math.min(vp[0], vp[1], gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), 8192);
  const k = Math.min(1, lim / Math.max(A.w, A.h)), rw = Math.round(A.w * k), rh = Math.round(A.h * k);
  const out = canvas(A.w, A.h), ctx = out.getContext('2d');
  if (st.withArt) ctx.drawImage(A.img, 0, 0);
  tc.visible = false; setOpacity(1);
  camera.clearViewOffset(); camera.aspect = A.w / A.h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(1); renderer.setSize(rw, rh, false);
  // 囲みで切るときはパーツごとに描いて、それぞれのアタリで切る（奥から順に重ねる）
  const passes = st.clip ? list.slice().sort((a, b) => a.group.position.z - b.group.position.z).map(p => [p]) : [list];
  const op = st.opacity; st.opacity = 1;
  for (const grp of passes) {
    passSet = new Set(grp);
    renderAll(Math.max(1, st.lineW * k));
    const p = grp[0];
    if (st.clip && p.target) {
      const t = canvas(A.w, A.h), tx = t.getContext('2d');
      tx.drawImage(c3d, 0, 0, A.w, A.h);
      tx.globalCompositeOperation = 'destination-in'; tracePath(tx, p.target); tx.fill();
      ctx.drawImage(t, 0, 0);
    } else ctx.drawImage(c3d, 0, 0, A.w, A.h);
  }
  passSet = null; st.opacity = op;
  tc.visible = true; setOpacity(st.opacity);
  renderer.setPixelRatio(DPR); renderer.setSize(WW, WH, false);
  applyView();
  out.toBlob(b => {
    const a = document.createElement('a'), d = new Date(), z = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(b);
    a.download = `atari3d-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(k < 1 ? `書き出しました（GPU の上限のため ${Math.round(k * 100)}% で描いて拡大）` : '書き出しました');
  }, 'image/png');
}

  const fs = [...(e.clipboardData?.items || [])].filter(i => /^image\//.test(i.type)).map(i => i.getAsFile());
  if (fs.length) { e.preventDefault(); openFiles(fs, 'auto'); }
});

resize(); refresh();
window.__atari = {st, THREE, tc};
</script>
