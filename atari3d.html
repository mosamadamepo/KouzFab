<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーツ立体アタリ</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f2ee;--panel:#fff;--ink:#222;--sub:#6b6b6b;--line:#dedad3;--acc:#d2553a;--acc-ink:#fff;--stage:#e6e2db;--soft:#f0ede8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--panel:#232326;--ink:#ececec;--sub:#a5a5a5;--line:#3a3a3f;--acc:#e8714f;--stage:#121214;--soft:#2c2c30}}
:root[data-theme="dark"]{--bg:#1b1b1d;--panel:#232326;--ink:#ececec;--sub:#a5a5a5;--line:#3a3a3f;--acc:#e8714f;--stage:#121214;--soft:#2c2c30}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{display:grid;grid-template-columns:320px 1fr;height:100dvh}
aside{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 14px 40px}
h1{font-size:16px;margin:0 0 2px}
.note{color:var(--sub);font-size:11px;margin:0 0 10px}
section{border-top:1px solid var(--line);padding:10px 0 6px}
h2{font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
h2 .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:11px}
h3{font-size:12px;margin:10px 0 4px;color:var(--sub);font-weight:600}
button{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--sub)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.on{outline:2px solid var(--acc);outline-offset:-2px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.st{color:var(--sub);font-size:11px}
.st.ok{color:#2e8b57}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px;width:100%}
label.sl{display:grid;grid-template-columns:62px 1fr 42px;gap:6px;align-items:center;margin:2px 0}
label.sl span{color:var(--sub);font-size:11px}
label.sl output{font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
label.sl.dis{opacity:.4;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--acc)}
label.ck{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:12px}
#parts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.part{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.part.cur{border-color:var(--acc);background:var(--soft)}
.part .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part .ic{border:0;background:none;padding:0 4px;font-size:13px}
.part .stt{font-size:10px;color:var(--sub)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#hint{flex:1;color:var(--sub);font-size:12px;min-width:0}
#hint b{color:var(--acc)}
#wrap{flex:1;position:relative;background:var(--stage);overflow:hidden;min-height:0}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 2px 14px #0003;touch-action:none;background:#fff}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg{pointer-events:none;overflow:visible}
.stage.lasso{cursor:crosshair}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);padding:20px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:.92}
.drop #wrap{outline:3px dashed var(--acc);outline-offset:-8px}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:62dvh auto;height:auto}
  main{order:-1;height:62dvh;position:sticky;top:0;z-index:2}
  aside{border-right:0;padding:12px 16px 60px}
}
</style>
</head>
<body>
<div id="app">
<aside>
  <h1>パーツ立体アタリ</h1>
  <p class="note">描きかけの絵に、資料のパーツを立体にして合わせ、透過 PNG で書き出します。<br>読み込んだ画像は端末の外に出しません（送信も保存もしません）。</p>

  <section>
    <h2><span class="n">1</span>描きかけの絵</h2>
    <div class="row"><button id="bArt" class="pri">絵を開く</button><span id="sArt" class="st">まだありません</span></div>
    <input type="file" id="fArt" accept="image/*" hidden>
  </section>

  <section>
    <h2><span class="n">2</span>パーツ</h2>
    <div id="parts"></div>
    <div class="row"><button id="bAdd">＋ パーツを足す</button><button id="bDup">複製</button><button id="bDel">消す</button></div>
  </section>

  <section id="secPart">
    <h2><span class="n">3</span>囲む</h2>
    <div class="row"><button id="bTarget">絵の上でアタリを囲む</button><span id="sTarget" class="st"></span></div>
    <div class="row"><button id="bRef">資料を開く</button><button id="bRefLasso">資料のパーツを囲む</button></div>
    <div class="row"><span id="sRef" class="st"></span></div>
    <input type="file" id="fRef" accept="image/*" hidden>

    <h2 style="margin-top:12px"><span class="n">4</span>立体にする</h2>
    <select id="selMethod"></select>
    <div id="slModel"></div>
    <label class="ck" id="ckInvWrap"><input type="checkbox" id="ckInv">明るいところをへこませる</label>

    <h2 style="margin-top:12px"><span class="n">5</span>位置を合わせる</h2>
    <div class="row" id="tools">
      <button data-tool="move" class="on">移動</button><button data-tool="rot">回転</button><button data-tool="roll">ひねる</button><button data-tool="scale">拡大</button>
    </div>
    <p class="st" style="margin:2px 0 4px">ドラッグ＝選んだ操作／右ドラッグ＝回転／ホイール＝拡大縮小（Shift＋ホイールでひねる）／2 本指＝拡大とひねり</p>
    <div id="slPos"></div>
    <label class="ck"><input type="checkbox" id="ckMirror">左右反転</label>
    <div class="row"><button id="bFit">アタリに合わせる</button><button id="bFitStretch">縦横もアタリに</button><button id="bRotReset">回転をもどす</button></div>
  </section>

  <section>
    <h2>見え方</h2>
    <select id="selMode">
      <option value="tex">資料の色</option>
      <option value="gray">グレーの陰影</option>
      <option value="flat">面で見る（フラット）</option>
      <option value="wire">ワイヤー</option>
    </select>
    <label class="ck"><input type="checkbox" id="ckEdges">稜線（輪郭）を描く</label>
    <label class="ck"><input type="checkbox" id="ckTargets" checked>アタリの囲みを表示</label>
    <div id="slView"></div>
  </section>

  <section>
    <h2><span class="n">6</span>書き出し</h2>
    <label class="ck"><input type="radio" name="scope" value="all" checked>表示中のパーツをすべて</label>
    <label class="ck"><input type="radio" name="scope" value="cur">選んでいるパーツだけ</label>
    <label class="ck"><input type="checkbox" id="ckClip">アタリの囲みの外を消す</label>
    <label class="ck"><input type="checkbox" id="ckWithArt">絵も重ねる（確認用。透過にならない）</label>
    <div class="row"><button id="bExport" class="pri">透過 PNG で書き出す</button></div>
    <p class="st">絵と同じ大きさで書き出します。クリスタなどで絵の上のレイヤーにそのまま重なります。</p>
  </section>
</aside>

<main>
  <div id="bar">
    <button data-view="art" class="on">絵</button><button data-view="ref">資料</button>
    <div id="hint"></div>
  </div>
  <div id="wrap">
    <div id="stArt" class="stage" hidden><canvas id="cArt"></canvas><canvas id="c3d"></canvas><svg id="ovArt"></svg></div>
    <div id="stRef" class="stage" hidden><canvas id="cRef"></canvas><svg id="ovRef"></svg></div>
    <div id="empty" class="empty"></div>
  </div>
</main>
</div>
<div id="toast"></div>

<script type="module">
// ---------- three.js（配布版は同梱バンドル、アーティファクト版は CDN） ----------
let THREE;
try { ({THREE} = await import('./vendor/kouzu3d.js')); }
catch (e) { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js'); }

const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;

// ---------- state ----------
// 画像はメモリ上だけ。localStorage にも IndexedDB にも残さない。
const st = {
  art: null, ref: null, refSeq: 0, parts: [], cur: null, pid: 0,
  view: 'art', armed: null, tool: 'move',
  mode: 'tex', edges: false, showTargets: true, opacity: 0.9, artFade: 1,
  fov: 30, lightAz: -35, lightEl: 40, scope: 'all', clip: false, withArt: false,
};

const METHODS = {
  inflate: {label: 'ふくらませる（髪・手・布・顔のパーツ）', depth: [0, 200, 60, 'ふくらみ'], smooth: [0, 8, 3, 'なめらか'], alpha: true},
  extrude: {label: '押し出す（板・刃物・アクセサリー）', depth: [1, 200, 15, '厚み'], smooth: [0, 8, 1, '角の丸み'], alpha: false},
  lathe:   {label: '回転体（ビン・カップ・柱・脚）', depth: [10, 200, 100, '奥行き'], smooth: [0, 8, 2, 'なめらか'], alpha: false},
  relief:  {label: '明暗の凹凸（レリーフ・模様）', depth: [0, 200, 25, '凹凸'], smooth: [0, 8, 2, 'なめらか'], alpha: true},
  box:     {label: '箱', depth: [1, 300, 60, '奥行き'], alpha: false},
  cyl:     {label: '円柱', depth: [10, 300, 100, '奥行き'], alpha: false},
  sphere:  {label: '球', depth: [10, 300, 100, '奥行き'], alpha: false},
};

// ---------- three ----------
const c3d = $('#c3d');
const renderer = new THREE.WebGLRenderer({canvas: c3d, alpha: true, antialias: true, preserveDrawingBuffer: true});
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 10000);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8580, 1.25);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
scene.add(hemi, sun, sun.target);

let needRender = false;
function requestRender() {
  if (needRender) return; needRender = true;
  requestAnimationFrame(() => { needRender = false; renderer.render(scene, camera); });
}

// 短辺ではなく絵のピクセルをそのまま世界座標にする：z=0 の面が絵と 1:1 で重なるようにカメラを置く
function setupCamera() {
  if (!st.art) return;
  const {w, h} = st.art;
  const dist = (h / 2) / Math.tan(st.fov * D2R / 2);
  camera.fov = st.fov; camera.aspect = w / h;
  camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0);
  camera.near = dist / 50; camera.far = dist * 20;
  camera.updateProjectionMatrix();
  placeLight();
}
function placeLight() {
  const r = st.art ? Math.max(st.art.w, st.art.h) * 3 : 3000;
  const az = st.lightAz * D2R, el = st.lightEl * D2R;
  sun.position.set(Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r, Math.cos(az) * Math.cos(el) * r);
  requestRender();
}

// ---------- images ----------
function loadImage(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('画像を読めませんでした')); };
    im.src = u;
  });
}
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function setArt(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  st.art = {img, w, h};
  const c = $('#cArt'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0);
  $('#sArt').textContent = `${w}×${h}`; $('#sArt').className = 'st ok';
  setupCamera();
  if (!st.parts.length) addPart();
  showView('art');
  if (st.cur && !st.cur.target) arm('target');
  refresh();
}
function setRef(img) {
  st.ref = {img, w: img.naturalWidth, h: img.naturalHeight, id: ++st.refSeq};
  const c = $('#cRef'); c.width = st.ref.w; c.height = st.ref.h; c.getContext('2d').drawImage(img, 0, 0);
  if (!st.cur) addPart();
  showView('ref'); arm('ref');
  refresh();
}
async function openFile(file, kind) {
  if (!file || !/^image\//.test(file.type)) { toast('画像ファイルを選んでください'); return; }
  try { const img = await loadImage(file); kind === 'art' ? setArt(img) : setRef(img); }
  catch (e) { toast(e.message); }
}

// ---------- parts ----------
function newPart() {
  const p = {
    id: ++st.pid, name: 'パーツ' + st.pid, visible: true,
    target: null, refId: 0, refPoly: null, crop: null,
    method: 'inflate', depth: METHODS.inflate.depth[2], smooth: METHODS.inflate.smooth[2], invert: false,
    mirror: false, scl: 1, sx: 1, sy: 1, sz: 1,
    group: new THREE.Group(), mesh: null, edges: null, tex: null, placed: false,
  };
  p.group.rotation.order = 'YXZ';
  scene.add(p.group);
  st.parts.push(p);
  return p;
}
function addPart() {
  const p = newPart(); select(p);
  if (st.art) { showView('art'); arm('target'); }
  return p;
}
function select(p) { st.cur = p; refresh(); }
function delPart(p) {
  if (!p) return;
  disposePart(p); scene.remove(p.group);
  st.parts = st.parts.filter(q => q !== p);
  st.cur = st.parts[st.parts.length - 1] || null;
  disarm(); refresh(); requestRender();
}
function disposePart(p) {
  if (p.mesh) { p.mesh.geometry.dispose(); p.mesh.material.dispose(); p.group.remove(p.mesh); p.mesh = null; }
  if (p.edges) { p.edges.geometry.dispose(); p.edges.material.dispose(); p.group.remove(p.edges); p.edges = null; }
}
function dupPart(src) {
  if (!src) return;
  const p = newPart();
  for (const k of ['target', 'refId', 'refPoly', 'crop', 'method', 'depth', 'smooth', 'invert', 'mirror', 'scl', 'sx', 'sy', 'sz', 'placed'])
    p[k] = Array.isArray(src[k]) ? src[k].map(v => v.slice()) : src[k];
  p.name = src.name + 'の複製';
  p.group.position.copy(src.group.position);
  if (st.art) p.group.position.x += st.art.w * 0.05;
  p.group.quaternion.copy(src.group.quaternion);
  if (p.crop) { makeTextures(p); build(p); }
  applyScale(p); select(p); requestRender();
}

// 資料の囲みから、切り抜き（矩形・囲みで透過・白いマスク）をつくる。長辺 1024px まで
function makeCrop(p, poly) {
  const R = st.ref;
  const xs = poly.map(q => q[0]), ys = poly.map(q => q[1]);
  const x0 = Math.max(0, Math.floor(Math.min(...xs))), y0 = Math.max(0, Math.floor(Math.min(...ys)));
  const x1 = Math.min(R.w, Math.ceil(Math.max(...xs))), y1 = Math.min(R.h, Math.ceil(Math.max(...ys)));
  const bw = x1 - x0, bh = y1 - y0;
  if (bw < 6 || bh < 6) { toast('囲みが小さすぎます'); return false; }
  const k = Math.min(1, 1024 / Math.max(bw, bh));
  const W = Math.max(2, Math.round(bw * k)), H = Math.max(2, Math.round(bh * k));
  const full = canvas(W, H); full.getContext('2d').drawImage(R.img, x0, y0, bw, bh, 0, 0, W, H);
  const lp = poly.map(([x, y]) => [(x - x0) * k, (y - y0) * k]);
  const masked = canvas(W, H), mc = masked.getContext('2d');
  mc.save(); tracePath(mc, lp); mc.clip(); mc.drawImage(full, 0, 0); mc.restore();
  const mask = canvas(W, H), kc = mask.getContext('2d');
  kc.drawImage(masked, 0, 0); kc.globalCompositeOperation = 'source-in'; kc.fillStyle = '#fff'; kc.fillRect(0, 0, W, H);
  p.crop = {W, H, full, masked, mask, poly: lp};
  p.refId = R.id; p.refPoly = poly;
  makeTextures(p);
  return true;
}
function makeTextures(p) {
  if (p.tex) Object.values(p.tex).forEach(t => t.dispose());
  const mk = (c, srgb) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
  p.tex = {full: mk(p.crop.full, true), masked: mk(p.crop.masked, true), mask: mk(p.crop.mask, false)};
}
function tracePath(ctx, pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }

// ---------- modeling ----------
// どの方式も、切り抜きのピクセル単位・中心が原点・y 上向きでつくる。テクスチャは正面からの投影（planarUV）
function sampleRGBA(src, gw, gh) {
  const c = canvas(gw, gh), x = c.getContext('2d', {willReadFrequently: true});
  x.drawImage(src, 0, 0, gw, gh); return x.getImageData(0, 0, gw, gh).data;
}
function gridDims(W, H, n) { const k = n / Math.max(W, H); return [Math.max(3, Math.round(W * k)), Math.max(3, Math.round(H * k))]; }
function blur(a, gw, gh, passes, keep) {
  for (let s = 0; s < passes; s++) {
    const b = new Float32Array(a.length);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      let sum = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= gw || yy >= gh) continue;
        sum += a[yy * gw + xx]; n++;
      }
      b[y * gw + x] = keep && !keep[y * gw + x] ? 0 : sum / n;
    }
    a = b;
  }
  return a;
}
function planarUV(g, W, H) {
  const pos = g.attributes.position, uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) { uv[i * 2] = pos.getX(i) / W + 0.5; uv[i * 2 + 1] = pos.getY(i) / H + 0.5; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
}
// 高さの格子 → 面。囲みに 1 点でもかかるマスは張る（外側は高さ 0、輪郭はテクスチャの透過で切る）
function heightMesh(hf, inside, gw, gh, W, H, back) {
  const n = gw * gh, layers = back ? 2 : 1;
  const pos = new Float32Array(n * 3 * layers), idx = [];
  for (let L = 0; L < layers; L++) for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const k = j * gw + i, o = (L * n + k) * 3;
    pos[o] = (i + 0.5) / gw * W - W / 2; pos[o + 1] = H / 2 - (j + 0.5) / gh * H; pos[o + 2] = L ? -hf[k] : hf[k];
  }
  for (let j = 0; j < gh - 1; j++) for (let i = 0; i < gw - 1; i++) {
    const a = j * gw + i, b = a + 1, c = a + gw, d = c + 1;
    if (!(inside[a] || inside[b] || inside[c] || inside[d])) continue;
    idx.push(a, c, d, a, d, b);
    if (back) idx.push(n + a, n + d, n + c, n + a, n + b, n + d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx);
  planarUV(g, W, H); g.computeVertexNormals();
  return g;
}
function maskGrid(p, res) {
  const {W, H} = p.crop, [gw, gh] = gridDims(W, H, res), d = sampleRGBA(p.crop.masked, gw, gh);
  const m = new Uint8Array(gw * gh); for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  return {gw, gh, m};
}
const GEN = {
  inflate(p) {
    const {W, H} = p.crop, {gw, gh, m} = maskGrid(p, 140);
    // 輪郭からの距離（2 パスのチャムファー）→ 丸い断面
    const dt = new Float32Array(gw * gh), S = Math.SQRT2;
    for (let i = 0; i < dt.length; i++) dt[i] = m[i] ? 1e9 : 0;
    const at = (x, y) => (x < 0 || y < 0 || x >= gw || y >= gh) ? 0 : dt[y * gw + x];
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) { const k = y * gw + x; if (dt[k]) dt[k] = Math.min(dt[k], at(x - 1, y) + 1, at(x, y - 1) + 1, at(x - 1, y - 1) + S, at(x + 1, y - 1) + S); }

slider($('#slView'), {label: '立体の濃さ', min: 10, max: 100, get: () => st.opacity * 100, set: v => { st.opacity = v / 100; setOpacity(st.opacity); }, fmt: v => v + '%', def: 90});
slider($('#slView'), {label: '絵の濃さ', min: 0, max: 100, get: () => st.artFade * 100, set: v => { st.artFade = v / 100; $('#cArt').style.opacity = st.artFade; }, fmt: v => v + '%', def: 100});
slider($('#slView'), {label: 'パース', min: 5, max: 90, get: () => st.fov, set: v => { st.fov = v; setupCamera(); }, fmt: v => v + '°', def: 30});
slider($('#slView'), {label: '光の向き', min: -180, max: 180, get: () => st.lightAz, set: v => { st.lightAz = v; placeLight(); }, fmt: v => v + '°', def: -35});
slider($('#slView'), {label: '光の高さ', min: -80, max: 90, get: () => st.lightEl, set: v => { st.lightEl = v; placeLight(); }, fmt: v => v + '°', def: 40});

const selM = $('#selMethod');
for (const [k, m] of Object.entries(METHODS)) selM.add(new Option(m.label, k));
selM.addEventListener('change', () => {
  const p = P(); if (!p) return;
  p.method = selM.value; p.depth = M().depth[2]; p.smooth = M().smooth?.[2] || 0;
  if (p.crop) build(p);
  refresh();
});

function syncUI() { UI.forEach(u => u.sync()); }

function refresh() {
  const p = st.cur;
  // パーツ一覧
  const list = $('#parts'); list.innerHTML = '';
  for (const q of st.parts) {
    const el = document.createElement('div'); el.className = 'part' + (q === p ? ' cur' : '');
    const stt = !q.target ? 'アタリ未' : !q.crop ? '資料未' : '';
    el.innerHTML = `<button class="ic" title="表示">${q.visible ? '👁' : '－'}</button><span class="nm"></span><span class="stt">${stt}</span>`;
    el.querySelector('.nm').textContent = q.name;
    el.addEventListener('click', () => { if (st.cur !== q) { disarm(); select(q); } });
    el.querySelector('.nm').addEventListener('dblclick', () => { const n = prompt('名前', q.name); if (n) { q.name = n.slice(0, 30); refresh(); } });
    el.querySelector('.ic').addEventListener('click', ev => { ev.stopPropagation(); q.visible = !q.visible; q.group.visible = q.visible; refresh(); requestRender(); });
    list.appendChild(el);
  }
  if (!st.parts.length) list.innerHTML = '<span class="st">パーツはまだありません</span>';
  $('#bDup').disabled = $('#bDel').disabled = !p;
  $('#secPart').style.opacity = p ? 1 : 0.45;
  $('#sTarget').textContent = p?.target ? '囲み済み' : '';
  $('#sTarget').className = 'st ok';
  $('#sRef').textContent = !st.ref ? '資料はまだありません' : p?.crop ? `切り抜き ${p.crop.W}×${p.crop.H}` + (p.refId !== st.ref.id ? '（前の資料から）' : '') : '資料のパーツをまだ囲んでいません';
  $('#sRef').className = 'st' + (p?.crop ? ' ok' : '');
  $('#bTarget').classList.toggle('on', st.armed === 'target');
  $('#bRefLasso').classList.toggle('on', st.armed === 'ref');
  $('#bRefLasso').disabled = !st.ref;
  if (p) { selM.value = p.method; $('#ckMirror').checked = p.mirror; $('#ckInv').checked = p.invert; }
  $('#ckInvWrap').hidden = !p || p.method !== 'relief';
  for (const b of ['#bFit', '#bFitStretch', '#bRotReset']) $(b).disabled = !has();
  $('#bExport').disabled = !st.art || !st.parts.some(q => q.mesh);
  stArt.classList.toggle('lasso', st.armed === 'target'); $('#stRef').classList.toggle('lasso', st.armed === 'ref');
  // 次にやること
  let h;
  if (st.armed === 'target') h = '<b>絵の上で</b>、パーツを入れたい範囲をぐるっと囲んでください（Esc でやめる）';
  else if (st.armed === 'ref') h = '<b>資料の上で</b>、立体にしたいパーツを輪郭どおりに囲んでください（Esc でやめる）';
  else if (!st.art) h = 'まず描きかけの絵を開いてください';
  else if (!p) h = '「＋ パーツを足す」で始めます';
  else if (!p.target) h = '「絵の上でアタリを囲む」で、パーツを入れる範囲を決めます';
  else if (!st.ref) h = '「資料を開く」で、パーツの資料を読み込みます（ドロップ・貼り付けも可）';
  else if (!p.crop) h = '「資料のパーツを囲む」で、使う部分を囲みます';
  else h = 'ドラッグで移動／右ドラッグで回転／ホイールで拡大縮小。合ったら「透過 PNG で書き出す」';
  $('#hint').innerHTML = h;
  syncUI(); drawOverlays();
}

// ---------- export ----------
function exportPNG() {
  const A = st.art; if (!A) return;
  const list = (st.scope === 'cur' ? [st.cur] : st.parts).filter(p => p && p.mesh && p.visible);
  if (!list.length) { toast('書き出す立体がありません'); return; }
  const gl = renderer.getContext();
  const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  const lim = Math.min(vp[0], vp[1], gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), 8192);
  const k = Math.min(1, lim / Math.max(A.w, A.h));
  const rw = Math.round(A.w * k), rh = Math.round(A.h * k);
  const prevPR = renderer.getPixelRatio(), prev = renderer.getSize(new THREE.Vector2());
  const out = canvas(A.w, A.h), ctx = out.getContext('2d');
  if (st.withArt) ctx.drawImage(A.img, 0, 0);
  setOpacity(1);
  renderer.setPixelRatio(1); renderer.setSize(rw, rh, false);
  // 囲みで切るときはパーツごとに描いて、それぞれのアタリで切る（奥から順に重ねる）
  const passes = st.clip ? list.slice().sort((a, b) => a.group.position.z - b.group.position.z).map(p => [p]) : [list];
  for (const grp of passes) {
    st.parts.forEach(p => { p.group.visible = grp.includes(p); });
    renderer.render(scene, camera);
    const p = grp[0];
    if (st.clip && p.target) {
      const t = canvas(A.w, A.h), tc = t.getContext('2d');
      tc.drawImage(c3d, 0, 0, A.w, A.h);
      tc.globalCompositeOperation = 'destination-in'; tracePath(tc, p.target); tc.fill();
      ctx.drawImage(t, 0, 0);
    } else ctx.drawImage(c3d, 0, 0, A.w, A.h);
  }
  st.parts.forEach(p => { p.group.visible = p.visible; });
  setOpacity(st.opacity);
  renderer.setPixelRatio(prevPR); renderer.setSize(prev.x, prev.y, false);
  renderer.render(scene, camera);
  out.toBlob(b => {
    const a = document.createElement('a'), d = new Date(), z = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(b);
    a.download = `atari3d-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(k < 1 ? `書き出しました（GPU の上限のため ${Math.round(k * 100)}% で描いて拡大）` : '書き出しました');
  }, 'image/png');
}

// ---------- wiring ----------
let toastT = 0;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

$('#bArt').onclick = () => $('#fArt').click();
$('#fArt').onchange = e => { openFile(e.target.files[0], 'art'); e.target.value = ''; };
$('#bRef').onclick = () => $('#fRef').click();
$('#fRef').onchange = e => { openFile(e.target.files[0], 'ref'); e.target.value = ''; };
$('#bAdd').onclick = () => { disarm(); addPart(); };
$('#bDup').onclick = () => dupPart(st.cur);
$('#bDel').onclick = () => { if (st.cur && confirm(`「${st.cur.name}」を消しますか？`)) delPart(st.cur); };
$('#bTarget').onclick = () => st.armed === 'target' ? disarm() : arm('target');
$('#bRefLasso').onclick = () => st.armed === 'ref' ? disarm() : arm('ref');
$('#bFit').onclick = () => { fit(st.cur, false); syncUI(); };
$('#bFitStretch').onclick = () => { fit(st.cur, true); syncUI(); };
$('#bRotReset').onclick = () => { st.cur.group.quaternion.identity(); syncUI(); requestRender(); };
$('#ckMirror').onchange = e => { st.cur && (st.cur.mirror = e.target.checked, applyScale(st.cur), requestRender()); };
$('#ckInv').onchange = e => { if (st.cur) { st.cur.invert = e.target.checked; rebuildSoon(st.cur); } };
document.querySelectorAll('#tools [data-tool]').forEach(b => b.onclick = () => {
  st.tool = b.dataset.tool; document.querySelectorAll('#tools [data-tool]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('#bar [data-view]').forEach(b => b.onclick = () => showView(b.dataset.view));
$('#selMode').onchange = e => { st.mode = e.target.value; rebuildAll(); };
$('#ckEdges').onchange = e => { st.edges = e.target.checked; rebuildAll(); };
$('#ckTargets').onchange = e => { st.showTargets = e.target.checked; drawOverlays(); };
document.querySelectorAll('input[name=scope]').forEach(r => r.onchange = () => { st.scope = r.value; });
$('#ckClip').onchange = e => { st.clip = e.target.checked; };
$('#ckWithArt').onchange = e => { st.withArt = e.target.checked; };
$('#bExport').onclick = exportPNG;
addEventListener('keydown', e => { if (e.key === 'Escape' && st.armed) disarm(); });

// ドロップ・貼り付け：絵がまだなら絵、あれば資料
const kindFor = () => !st.art ? 'art' : 'ref';
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('drop');
  const f = [...(e.dataTransfer?.files || [])].find(f => /^image\//.test(f.type)); if (f) openFile(f, kindFor());
});
addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => /^image\//.test(i.type));
  if (it) { e.preventDefault(); openFile(it.getAsFile(), kindFor()); }
});

setupCamera(); layout(); refresh();
window.__atari = {st, THREE};
</script>
